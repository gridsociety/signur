[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signur"
version = "0.1.0"
description = "Self-hosted service for graphical and digital document signatures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4,<1.19",
  "asn1crypto>=1.5.1,<2",
  "cryptography>=46,<47",
  "defusedxml>=0.7.1,<0.8",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "pillow>=11,<13",
  "pyhanko>=0.33,<0.34",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy>=2.0.52,<2.1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<0.36",
  "python-pkcs11>=0.9,<0.10",
  "signxml>=5.1.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<0.23",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<0.16",
  "types-defusedxml>=0.7.0,<0.8",
]

[project.scripts]
signur = "signur.main:run"
signur-admin = "signur.admin_cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/signur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
