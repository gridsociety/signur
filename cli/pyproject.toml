[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signur-cli"
version = "0.1.0"
description = "CLI autenticata per Signur"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.28,<0.29",
  "keyring>=25,<26",
]

[project.scripts]
signur = "signur_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signur_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["signur_cli"]
